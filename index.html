    <meta name="theme-color" content="#050505" />
    <meta name="description" content="Aquarismo Panucci - Espécies exclusivas, equipamentos premium e paixão por aquarismo." />
    
    <!-- PWA Configs -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Favicon e Ícone de App (iOS/Android) -->
    <link rel="icon" type="image/png" href="https://i.postimg.cc/brDgBVTJ/Logo-Panucci.png" />
    <link rel="apple-touch-icon" href="https://i.postimg.cc/brDgBVTJ/Logo-Panucci.png" />
    
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aquarismo Panucci" />

    <title>Aquarismo Panucci - Espécies Exclusivas & Equipamentos Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Playfair Display para Títulos (Premium) e Plus Jakarta Sans para leitura (Clean) -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html {
        scroll-behavior: smooth;
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      ::-webkit-scrollbar {
        display: none;
      }

      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #050505; /* Preto Profundo */
        color: #ffffff; /* Texto Branco */
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      
      h1, h2, h3, h4, .font-heading {
        font-family: 'Playfair Display', serif;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "framer-motion": "https://esm.sh/framer-motion@^12.29.2",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.93.3",
    "vite": "https://esm.sh/vite@^7.3.1",

  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registrado com sucesso:', registration.scope);
            })
            .catch(error => {
              console.log('Falha ao registrar SW:', error);
            });
        });
      }
    </script>
  </body>
